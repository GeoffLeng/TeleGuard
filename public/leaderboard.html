<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TeleGuard Community Leaderboard</title>
  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/leaderboard.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="category-switch-container">
        <button id="cat-activity" class="category-btn active">
          <span class="cat-icon">⚡</span>
          <span data-i18n="lb_activity_ranking">Activity Ranking</span>
        </button>
      </div>
      <div class="header-right-tools">
        <button class="lang-switch-btn" onclick="window.i18n.toggle()" title="Switch Language">
          <span>🌐</span>
          <span class="lang-switch-label">English</span>
        </button>
      </div>
    </header>

    <!-- Sub Tab Selectors (Weekly vs All-Time) -->
    <div class="tabs-container">
      <div class="tabs-pill">
        <button id="tab-weekly" class="tab-btn active" onclick="switchTab('weekly')" data-i18n="lb_weekly">Weekly</button>
        <button id="tab-all" class="tab-btn" onclick="switchTab('all')" data-i18n="lb_all_time">All-Time</button>
      </div>
    </div>

    <!-- Leaderboard List -->
    <main class="leaderboard-container">
      <ul id="leaderboard-list" class="leaderboard-list">
        <div class="loading-spinner">
          <div class="spinner"></div>
          <p data-i18n="lb_loading">Loading Leaderboard...</p>
        </div>
      </ul>
    </main>

    <!-- Sticky Footer (Current User Details) -->
    <footer id="sticky-footer" class="user-footer hidden">
      <div class="user-footer-content">
        <span class="you-badge" data-i18n="lb_you">YOU</span>
        <span id="footer-rank" class="footer-rank">#--</span>
        <div id="footer-avatar" class="footer-avatar"></div>
        <span id="footer-name" class="footer-name" data-i18n="lb_footer_loading">Loading...</span>
        <span id="footer-xp" class="footer-xp">0 XP</span>
      </div>
    </footer>
  </div>

  <!-- Custom JavaScript -->
  <script src="js/i18n.js"></script>
  <script src="js/leaderboard.js?v=2.1"></script>
</body>
</html>
